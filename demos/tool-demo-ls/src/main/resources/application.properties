quarkus.package.main-class=demo.LsToolDemo

## JitLLM configuration
quarkus.langchain4j.jitllm.enable-integration=true
## Qwen3-4B completes the tool round trip reliably: it calls the tool once, reads the result and
## answers from it. Llama 3.2 1B keeps re-calling the tool after the result until LangChain4j
## stops it ("exceeded 10 sequential tool executions"); Llama 3.2 3B calls it once but then
## describes the call instead of reporting the result. Qwen3-1.7B works for lighter use.
quarkus.langchain4j.jitllm.chat-model.model-name=ggml-org/Qwen3-4B-GGUF
quarkus.langchain4j.jitllm.chat-model.quantization=Q8_0
#quarkus.langchain4j.jitllm.chat-model.model-name=ggml-org/Qwen3-1.7B-GGUF
#quarkus.langchain4j.jitllm.chat-model.quantization=Q8_0
## Qwen3 recommended sampling (non-thinking mode)
quarkus.langchain4j.jitllm.chat-model.temperature=0.6
quarkus.langchain4j.jitllm.chat-model.top-p=0.95

## Also the context length: the tool result (up to 100 entries, see DirectoryTools) has to fit in
## it together with the prompt and the answer, which echoes the listing. If it does not fit, the
## model returns an empty answer.
quarkus.langchain4j.jitllm.chat-model.max-tokens=8192

## Log requests/responses to see tool call round-trips in the output
quarkus.langchain4j.jitllm.log-requests=true
quarkus.langchain4j.jitllm.log-responses=true

## Device memory for the TornadoVM heap. Set here rather than via -Dtornado.device.memory:
## the extension applies this property itself and the command-line flag is ignored
## (the default 4GB is too small for this model).
quarkus.langchain4j.jitllm.chat-model.device-memory=8GB
