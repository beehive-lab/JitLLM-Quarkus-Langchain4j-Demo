quarkus.package.main-class=demo.SummarizationDemo

## JitLLM configuration
quarkus.langchain4j.jitllm.enable-integration=true
quarkus.langchain4j.jitllm.chat-model.model-name=unsloth/Llama-3.2-1B-Instruct-GGUF
#quarkus.langchain4j.jitllm.chat-model.quantization=Q8_0
quarkus.langchain4j.jitllm.chat-model.quantization=F16
quarkus.langchain4j.jitllm.chat-model.temperature=0.7
quarkus.langchain4j.jitllm.chat-model.max-tokens=2048

## Device memory for the TornadoVM heap. Set here rather than via -Dtornado.device.memory:
## the extension applies this property itself and the
## command-line flag is ignored (the default 4GB OOMs on F16 models).
quarkus.langchain4j.jitllm.chat-model.device-memory=8GB
